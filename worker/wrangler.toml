name = "ai-gym-coach-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Comma-separated list of origins allowed to call the API (your GitHub Pages URL).
ALLOWED_ORIGINS = "https://legolassrb.github.io"
# Claude model used for planning. Switch to "claude-haiku-5-5" for cheaper/faster plans.
MODEL = "claude-sonnet-5-5"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   ANTHROPIC_API_KEY  - your Claude API key
#   APP_PASSPHRASE     - the passphrase the iPhone app sends as a Bearer token

[[d1_databases]]
binding = "DB"
database_name = "gym-coach"
database_id = "4672d4e2-209f-4252-a733-18d92c9ec962"
