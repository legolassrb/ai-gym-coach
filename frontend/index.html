<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Coach" />
  <title>AI Gym Coach</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="title">Today</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="rest" class="rest hidden" role="status">
    <span>Rest</span><strong id="rest-time">0:00</strong>
    <button id="rest-skip" class="ghost small">Skip</button>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <nav class="tabbar">
    <button data-tab="today" class="active"><span class="ico">🏋️</span>Today</button>
    <button data-tab="history"><span class="ico">📈</span>History</button>
    <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
